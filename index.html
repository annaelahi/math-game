<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی آزمون ریاضی</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <main class="app-container">
        <header class="game-header">
            <h1 class="logo">آزمون<span class="highlight">ریاضی</span></h1>
            <div class="score-board">
                <div class="score-item" title="تعداد سوالات">
                    <span class="label">کل</span>
                    <span id="score-total" class="value">0</span>
                </div>
                <div class="score-item success" title="پاسخ‌های درست">
                    <span class="label">درست</span>
                    <span id="score-correct" class="value">0</span>
                </div>
                <div class="score-item danger" title="پاسخ‌های اشتباه">
                    <span class="label">اشتباه</span>
                    <span id="score-wrong" class="value">0</span>
                </div>
            </div>
        </header>

        <section id="menu-screen" class="screen active">
            <h2>انتخاب سختی</h2>
            <div class="difficulty-grid">
                <button class="btn btn-outline" data-level="1">خیلی آسان</button>
                <button class="btn btn-outline" data-level="2">آسان</button>
                <button class="btn btn-outline" data-level="3">متوسط</button>
                <button class="btn btn-outline" data-level="4">سخت</button>
                <button class="btn btn-outline" data-level="5">حرفه‌ای</button>
            </div>
            
            <div class="options-row">
                <button id="btn-quick-mode" class="btn btn-secondary">حالت سریع: خاموش</button>
                <button id="btn-info" class="btn btn-small" aria-label="Info">?</button>
            </div>
        </section>

        <section id="game-screen" class="screen hidden">
            <div class="question-container">
                <span class="q-label">سوال <span id="q-number">1</span></span>
                <div id="question-text" class="math-problem">Loading...</div>
            </div>

            <div class="timer-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" readonly placeholder="?">
                <button id="btn-backspace" class="btn-icon">⌫</button>
            </div>

            <div class="numpad">
                <button class="num-btn" data-val="1">1</button>
                <button class="num-btn" data-val="2">2</button>
                <button class="num-btn" data-val="3">3</button>
                <button class="num-btn" data-val="4">4</button>
                <button class="num-btn" data-val="5">5</button>
                <button class="num-btn" data-val="6">6</button>
                <button class="num-btn" data-val="7">7</button>
                <button class="num-btn" data-val="8">8</button>
                <button class="num-btn" data-val="9">9</button>
                <button class="num-btn" data-val="-">-</button>
                <button class="num-btn" data-val="0">0</button>
                <button class="num-btn" data-val=".">.</button>
            </div>

            <div class="action-row">
                <button id="btn-reset" class="btn btn-text">خروج</button>
                <button id="btn-submit" class="btn btn-primary">ارسال</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
